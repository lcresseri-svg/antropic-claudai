<script>
// Prototipo di studio: stato esclusivamente in memoria, nessun servizio o salvataggio reale.
const q=new URLSearchParams(location.search),$=s=>document.querySelector(s);
const paths={home:'M3 10.5 12 3l9 7.5 M5 9.5V21h5v-5h4v5h5V9.5',list:'M4 6h16 M4 12h16 M4 18h16',wealth:'M3 17l5-5 4 3 5-7 M3 21h18',plus:'M12 5v14 M5 12h14',arrow:'m9 5 7 7-7 7',back:'m15 5-7 7 7 7',search:'M21 21l-5-5 M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0',close:'m6 6 12 12 M18 6 6 18',check:'m5 12 4 4 10-10',clock:'M12 7v5l3 2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',wallet:'M4 5h15v15H4z M15 10h6v6h-6z',calendar:'M4 5h16v16H4z M8 2v6 M16 2v6 M4 10h16',filter:'M4 6h16 M7 12h10 M10 18h4'};
function icon(name,size=20){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[name]||paths.list}"/></svg>`}
const logo='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="rgb(200,160,90)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="40.06 13.35" transform="rotate(135 12 12)"/></svg><span>sunny</span>';
const escapeHTML=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:2}).format(n);
const cats={casa:{name:'Casa',emoji:'🏠',limit:900},spesa:{name:'Spesa',emoji:'🛒',limit:350},ristoranti:{name:'Ristoranti',emoji:'🍽️',limit:150},trasporti:{name:'Trasporti',emoji:'🚗',limit:150},salute:{name:'Salute',emoji:'🩺',limit:150}};

let state,dirty=false,trigger=null,toastTimer=null;const scrolls={};const modal=$('#modal'),discard=$('#discard');
function reset(){const scenario=$('#scenario').value;state={page:q.get('page')||'oggi',tab:q.get('tab')||'piano',scenario,rows:structuredClone(baseline),search:'',filter:'',hasPeriod:true,plan:!['no-plan','empty'].includes(scenario),income:2400,savings:400,invest:200,pending:true};if(scenario==='negative')state.rows.unshift({id:'unexpected',date:'2026-10-11',amount:700,cat:'casa',name:'Riparazione imprevista'});if(scenario==='empty'){state.rows=[];state.pending=false;state.hasPeriod=false}render()}
function dueItems(){return state.scenario==='empty'?[]:due}
function totals(){const spent=state.rows.reduce((s,r)=>s+r.amount,0),empty=state.scenario==='empty',fresh=state.newAccountBalance!==undefined,change=spent-900,cash=fresh?state.newAccountBalance-spent:empty?0:4820-change,scheduled=empty?0:350,capacity=state.income-state.savings-state.invest;return {spent,cash,scheduled,capacity,margin:capacity-spent-scheduled,free:cash-scheduled-(empty?0:500),net:cash+(empty?0:4200),current:fresh?cash:empty?0:3920-change}}

function badge(){return `<span class="badge"><i></i>Piano confermato</span>`}
function pendingIncome(){return state.scenario==='pending-income'?'<p class="notice">Il margine include <strong>1200 € ancora da incassare</strong>. Dipende dal loro arrivo.</p>':''}
function home(){const t=totals();if(state.scenario==='empty'&&state.newAccountBalance===undefined)return title('Oggi','Lunedì 12 ottobre')+`<section class="empty"><div class="eyebrow">Il tuo punto di partenza</div><h2 style="margin-top:16px">Un conto. Poi il primo movimento.</h2><p>Parti dal saldo che conosci. Il piano e gli obiettivi possono aspettare.</p><button class="button primary" data-empty-account>Aggiungi il primo conto</button><p class="small">Puoi anche importare un file o esplorare dati di esempio.</p></section>`;
return title('Oggi','Lunedì 12 ottobre')+`<div class="today-grid"><div><section class="month-hero"><div class="flex between"><span class="hero-month">Il tuo ottobre</span>${state.plan?badge():'<span class="badge">Senza piano</span>'}</div><p class="metric-label">${state.plan?'Margine del piano':'Uscite registrate'}</p><p class="hero-number money ${state.plan&&t.margin<0?'danger':''}">${money(state.plan?t.margin:t.spent)}</p><p class="hero-explain">${state.plan?'Dopo spese, impegni e obiettivi del mese.':'Le tue spese dal 1° ottobre, senza un piano del mese.'}</p>${pendingIncome()}${state.plan&&t.margin<0?'<p class="notice error">Le spese e gli obiettivi superano le entrate del piano.</p>':''}<div class="hero-bottom"><small class="muted">${state.plan?'Il saldo dei conti è separato.':'Il piano è facoltativo.'}</small><button class="text-button" data-month>${state.plan?'Apri il mese':'Esplora il mese'} ›</button></div></section>${state.pending?`<section class="section"><h2>Da completare</h2><div class="attention"><span class="attention-mark">${icon('check',18)}</span><div><h3>Un pagamento da confermare</h3><p>20,00 € · Supermercato · Apple Pay</p></div><button class="text-button" data-payment>Rivedi pagamento ›</button></div></section>`:''}</div><div class="support"><button class="cash-line" data-nav="patrimonio"><span>Saldo dei conti<small>Il denaro presente sui conti inclusi</small></span><span class="flex"><strong class="money">${money(t.cash)}</strong>${icon('arrow',15)}</span></button><section class="section"><div class="section-head"><h2>Ultimi movimenti</h2><button class="text-button" data-nav="movimenti">Tutti ›</button></div>${rowsHTML(state.rows.slice(0,3))}</section></div></div>`}
function rowsHTML(rows){return rows.map(r=>`<button class="tx-row" data-row="${escapeHTML(r.id)}"><span class="tx-icon" aria-hidden="true">${cats[r.cat].emoji}</span><span><span class="name">${escapeHTML(r.name)}</span><span class="meta">${Number(r.date.slice(-2))} ottobre · Conto Corrente</span></span><span class="money">−${money(r.amount)}</span></button>`).join('')}
function month(){const t=totals(),tabs=[['riepilogo','Riepilogo'],['piano','Piano'],['scadenze','Scadenze']];let content='';if(state.tab==='riepilogo')content=`<div class="plan-grid"><section><div class="eyebrow">Uscite registrate · ottobre</div><div class="net-number money">${money(t.spent)}</div><p class="small muted">${state.rows.length} movimenti. Le spese programmate sono separate.</p><div class="section"><h2>Dove hai speso</h2>${Object.keys(cats).map(c=>{let a=state.rows.filter(r=>r.cat===c).reduce((s,r)=>s+r.amount,0);return a?`<div class="bar-row"><div><span>${cats[c].name}</span><strong class="money">${money(a)}</strong></div><div class="track"><span class="spent" style="width:${a/Math.max(1,t.spent)*100}%"></span></div></div>`:''}).join('')}</div></section><section><h2>Leggi i dettagli</h2><button class="data-row" style="width:100%" data-nav="movimenti"><span>Movimenti di ottobre</span>${icon('arrow',16)}</button><button class="data-row" style="width:100%" data-plan-tab><span>Il tuo piano</span>${icon('arrow',16)}</button><p class="note">Il piano include le tue intenzioni e le spese programmate.</p></section></div>`;
else if(state.tab==='scadenze')content=`<h2>In arrivo a ottobre</h2><p class="small muted" style="margin-top:8px">Già incluse nel programmato del piano.</p>${dueItems().map(d=>`<button class="data-row" style="width:100%;text-align:left" data-due="${d.cat}"><span>${d.name}<small>${d.date} · ${cats[d.cat].name}</small></span><strong class="money">${money(d.amount)}</strong></button>`).join('')}<p class="note">Il costo mensile equivalente degli abbonamenti si consulta negli Impegni. Non sostituisce questi addebiti.</p><button class="text-button" data-commitments>Gestisci impegni ›</button>`;
else if(!state.plan)content=`<section class="empty"><h2>Decidi come vuoi organizzare il mese.</h2><p>Parti dalle entrate attese e da quanto vuoi lasciare da parte. I limiti per categoria sono facoltativi.</p><button class="button primary" data-plan-edit>Prepara il piano</button></section>`;
else content=`<div class="plan-grid"><section><div class="flex between"><span class="eyebrow">Margine del piano</span>${badge()}</div><div class="net-number money ${t.margin<0?'danger':''}">${money(t.margin)}</div><p class="small muted">Per le spese non programmate, dopo gli obiettivi.</p>${pendingIncome()}${t.margin<0?'<p class="notice error">Il piano supera le entrate attese. Rivedi le tue scelte.</p>':''}<div class="track" aria-hidden="true"><span class="spent" style="width:${Math.min(100,t.spent/t.capacity*100)}%"></span><span class="scheduled" style="width:${Math.max(0,Math.min(t.scheduled/t.capacity*100,100-t.spent/t.capacity*100))}%"></span></div><div class="plan-stats"><div><small>Speso</small><strong class="money">${money(t.spent)}</strong></div><div><small>Programmato</small><strong class="money">${money(t.scheduled)}</strong></div><div><small>Per le spese</small><strong class="money">${money(t.capacity)}</strong></div></div><button class="text-button" data-calculation>Come è calcolato ›</button><p class="small muted">Questo è un piano mensile. Il saldo dei conti è un dato diverso.</p><div class="section"><h2>Le tue scelte</h2><div class="data-row"><span>Entrate attese</span><strong class="money">${money(state.income)}</strong></div><div class="data-row"><span>Risparmio da mantenere</span><strong class="money">${money(state.savings)}</strong></div><div class="data-row"><span>Investimenti dai conti</span><strong class="money">${money(state.invest)}</strong></div><button class="text-button" data-plan-edit>Modifica piano ›</button></div></section><section class="section" style="margin-top:0"><div class="section-head"><h2>Categorie</h2><span class="small muted">Dopo il programmato</span></div>${Object.keys(cats).map(c=>{const spent=state.rows.filter(r=>r.cat===c).reduce((s,r)=>s+r.amount,0),scheduled=dueItems().filter(d=>d.cat===c).reduce((s,d)=>s+d.amount,0),remaining=cats[c].limit-spent-scheduled;return `<button class="category-row" data-category="${c}"><span>${cats[c].emoji} ${cats[c].name}</span><strong class="money ${remaining<0?'danger':''}">${money(remaining)} <span class="muted small">residui</span></strong><small>Speso ${money(spent)} · Programmato ${money(scheduled)}</small></button>`}).join('')}<p class="note">Il risparmio è un obiettivo del mese, non denaro già accantonato.</p></section></div>`;
return `<button class="back-link" data-nav="oggi">${icon('back',16)} Oggi</button>`+title('Il tuo ottobre')+`<div class="subnav" role="group" aria-label="Sezioni del mese">${tabs.map(([key,label])=>`<button data-tab="${key}" class="${key===state.tab?'active':''}" aria-pressed="${key===state.tab}">${label}</button>`).join('')}</div>`+content}
function visibleRows(){return state.rows.filter(r=>(!state.filter||r.cat===state.filter)&&(!state.search||(`${r.name} ${cats[r.cat].name} ${r.amount}`).toLocaleLowerCase('it').includes(state.search.toLocaleLowerCase('it'))))}
function chipsHTML(){return `${state.hasPeriod?'<button class="chip" data-clear-period aria-label="Rimuovi filtro periodo">Ottobre 2026 '+icon('close',12)+'</button>':''}${state.filter?`<button class="chip" data-clear-category aria-label="Rimuovi filtro categoria">${cats[state.filter].name} ${icon('close',12)}</button>`:''}`}
function ledger(){return `<div class="ledger">${title('Movimenti')}<div class="search-line"><label class="search-field"><span>Cerca nei movimenti</span><span class="search-wrap">${icon('search',18)}<input id="search" type="search" placeholder="Nome, categoria o importo" value="${escapeHTML(state.search)}"></span></label><button class="filter-button flex" data-filters>${icon('filter',17)}<span>Filtri${state.filter?' · '+(state.hasPeriod?2:1):state.hasPeriod?' · 1':''}</span></button></div><div class="chips" id="chips">${chipsHTML()}</div><div id="ledger-results">${ledgerResults()}</div></div>`}
function ledgerResults(){const rows=visibleRows();return `<div class="list-summary"><span>${rows.length} ${rows.length===1?'movimento':'movimenti'}</span><strong class="money">Uscite ${money(rows.reduce((s,r)=>s+r.amount,0))}</strong></div>${rows.length?rowsHTML(rows):'<section class="empty"><h2>Nessun risultato</h2><p>Prova un altro nome oppure modifica i filtri. La ricerca rimane qui.</p><button class="text-button" data-filters>Modifica filtri ›</button></section>'}`}
function wealth(){const t=totals();if(state.scenario==='empty'&&state.newAccountBalance===undefined)return title('Patrimonio','La tua situazione parte dai conti che conosci.')+'<section class="empty"><h2>Aggiungi il primo conto.</h2><p>Non ci sono ancora saldi da mostrare.</p><button class="button primary" data-empty-account>Aggiungi il primo conto</button></section>';return title('Patrimonio','Conti e investimenti')+`<div class="wealth-grid"><section><p class="eyebrow">Patrimonio netto</p><p class="net-number money">${money(t.net)}</p><p class="small muted">Conti inclusi + capitale investito.</p><div class="split"><div><small>Saldo dei conti</small><strong class="money">${money(t.cash)}</strong></div><div><small>Capitale investito</small><strong class="money">${money(state.scenario==='empty'?0:4200)}</strong></div></div><div class="section"><div class="flex between"><h2>Liquidità libera stimata</h2><strong class="money">${money(t.free)}</strong></div><p class="small muted" style="margin-top:8px">Dopo ${money(t.scheduled)} di impegni entro fine mese e ${money(state.scenario==='empty'?0:500)} di riserva.</p><button class="text-button" data-cash-calculation>Vedi calcolo ›</button></div><div class="section"><h2>Investimenti</h2><button class="account-row" style="width:100%;text-align:left" data-investments><span class="tx-icon">${icon('wealth')}</span><span>Il tuo portafoglio<small>Capitale e ultimo valore noto</small></span>${icon('arrow',16)}</button></div></section><section class="section" style="margin-top:0"><h2>I tuoi conti</h2>${(state.scenario==='empty'?[['Conto Corrente',t.current,'wallet']]:[['Conto Corrente',t.current,'wallet'],['Contanti',180,'wallet'],['Risparmio',720,'wallet']]).map(([name,value,ic])=>`<button class="account-row" style="width:100%;text-align:left" data-account><span class="tx-icon">${icon(ic,18)}</span><span>${name}<small>Incluso nel totale</small></span><strong class="money">${money(value)}</strong></button>`).join('')}<p class="note">Mostrare gli investimenti e includerli nel patrimonio sono due scelte distinte.</p></section></div>`}
function render(){const valid=['oggi','mese','movimenti','patrimonio'];if(!valid.includes(state.page))state.page='oggi';$('#main').innerHTML=state.page==='oggi'?home():state.page==='mese'?month():state.page==='movimenti'?ledger():wealth();renderNav();bindMain()}
function renderNav(){const nav=[['oggi','Oggi','home'],['movimenti','Movimenti','list'],['patrimonio','Patrimonio','wealth']],current=state.page==='mese'?'oggi':state.page;const html=nav.map(([key,label,ic])=>`<button data-nav="${key}" class="${key===current?'active':''}" ${key===current?'aria-current="page"':''}>${icon(ic,21)}<span>${label}</span></button>`).join('');$('#bottom-nav').innerHTML=html;$('#side-links').innerHTML=nav.map(([key,label,ic])=>`<button data-nav="${key}" class="${key===current?'active':''}" ${key===current?'aria-current="page"':''}>${icon(ic,20)}<span>${label}</span></button>${key==='oggi'?'<button class="month-link" data-month>Il tuo mese</button>':''}`).join('');bindNav($('#bottom-nav'));bindNav($('#side-links'))}
function go(page,fromHistory=false){scrolls[state.page]=scrollY;state.page=page;if(!fromHistory){const url=new URL(location.href);url.searchParams.set('page',page);history.pushState({page},'',url)}render();$('#main').focus({preventScroll:true});window.scrollTo(0,scrolls[page]||0)}
function bindNav(root){root.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));root.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{state.tab='piano';go('mese')})}
function bindMain(){bindNav($('#main'));$('#search')?.addEventListener('input',e=>{state.search=e.target.value;updateLedger()});$('#main').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});$('#main').querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>rowDetail(b.dataset.row));$('#main').querySelectorAll('[data-payment]').forEach(b=>b.onclick=payment);$('#main').querySelectorAll('[data-filters]').forEach(b=>b.onclick=filters);$('#main').querySelectorAll('[data-calculation]').forEach(b=>b.onclick=calculation);$('#main').querySelectorAll('[data-cash-calculation]').forEach(b=>b.onclick=cashCalculation);$('#main').querySelectorAll('[data-plan-edit]').forEach(b=>b.onclick=editPlan);$('#main').querySelectorAll('[data-plan-tab]').forEach(b=>b.onclick=()=>{state.tab='piano';render()});$('#main').querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>categoryDetail(b.dataset.category));$('#main').querySelectorAll('[data-due]').forEach(b=>b.onclick=()=>categoryDetail(b.dataset.due));$('#main').querySelectorAll('[data-account]').forEach(b=>b.onclick=()=>go('movimenti'));$('#main').querySelectorAll('[data-investments]').forEach(b=>b.onclick=investments);$('#main').querySelectorAll('[data-commitments]').forEach(b=>b.onclick=()=>show('Impegni',`<p class="small muted">Addebiti previsti nel mese</p>${dueItems().map(d=>`<div class="data-row"><span>${d.name}<small>${d.date}</small></span><strong class="money">${money(d.amount)}</strong></div>`).join('')}<p class="note">Le scadenze sono già comprese nel programmato del piano.</p>`));$('#main').querySelectorAll('[data-empty-account]').forEach(b=>b.onclick=firstAccount);bindChips()}
function bindChips(){$('[data-clear-category]')?.addEventListener('click',()=>{state.filter='';updateLedger()});$('[data-clear-period]')?.addEventListener('click',()=>{state.hasPeriod=false;updateLedger()})}
function updateLedger(){$('#ledger-results').innerHTML=ledgerResults();$('#chips').innerHTML=chipsHTML();const f=$('[data-filters]');if(f)f.innerHTML=icon('filter',17)+`<span>Filtri${state.filter?' · '+(state.hasPeriod?2:1):state.hasPeriod?' · 1':''}</span>`;$('#ledger-results').querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>rowDetail(b.dataset.row));$('#ledger-results').querySelectorAll('[data-filters]').forEach(b=>b.onclick=filters);bindChips()}
function show(titleText,body,footer=''){trigger=document.activeElement;dirty=false;modal.innerHTML=`<div class="dialog-head"><h2 id="modal-title">${titleText}</h2><button class="close" data-close aria-label="Chiudi">${icon('close',18)}</button></div><div class="dialog-body">${body}</div>${footer?`<div class="dialog-actions">${footer}</div>`:''}`;modal.querySelector('[data-close]').onclick=requestClose;modal.showModal()}
function finishClose(){modal.close();trigger?.isConnected&&trigger.focus({preventScroll:true});dirty=false}
function requestClose(){if(dirty){discard.showModal();$('#keep-editing').focus()}else finishClose()}
modal.addEventListener('cancel',e=>{e.preventDefault();requestClose()});modal.addEventListener('click',e=>{if(e.target===modal){const r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)requestClose()}});discard.addEventListener('cancel',e=>{e.preventDefault();discard.close()});$('#keep-editing').onclick=()=>discard.close();$('#discard-changes').onclick=()=>{discard.close();finishClose()};
function expense(paymentMode=false,editId=null){const existing=state.rows.find(r=>r.id===editId);show(existing?'Modifica uscita':paymentMode?'Conferma pagamento':'Nuova uscita',`<form id="expense-form"><span class="badge">Uscita</span><div class="amount-group"><label for="amount">Importo</label><div class="amount-entry"><input id="amount" inputmode="decimal" type="text" placeholder="0,00" value="${existing?String(existing.amount).replace('.',','):paymentMode?'20,00':''}" autocomplete="off"><span>€</span></div></div><label class="form-field">Descrizione (facoltativa)<input id="description" placeholder="Es. Supermercato" value="${escapeHTML(existing?.name||(paymentMode?'Supermercato':''))}" maxlength="80"></label><div class="form-field"><label for="category">Categoria</label><select id="category">${Object.keys(cats).map(c=>`<option value="${c}" ${c===(existing?.cat||'spesa')?'selected':''}>${cats[c].emoji} ${cats[c].name}</option>`).join('')}</select></div><div class="form-grid"><label class="form-field">Conto<select aria-label="Conto"><option>Conto Corrente</option></select></label><label class="form-field">Data<input id="date" type="date" value="${existing?.date||'2026-10-12'}" min="2026-10-01" max="2026-10-31"></label></div><details class="section"><summary>Dettagli avanzati</summary><div class="data-row"><span>Ricorrenza</span><span>Non ricorrente</span></div><div class="data-row"><span>Ripartizione</span><span>Spesa personale</span></div></details><p id="save-error" class="form-error" role="alert" hidden></p></form>`,`<button class="button secondary" data-cancel>Annulla</button><button class="button primary" type="submit" form="expense-form">${paymentMode?'Conferma pagamento':'Salva uscita'}</button>`);modal.querySelector('[data-cancel]').onclick=requestClose;$('#expense-form').oninput=()=>dirty=true;$('#expense-form').onchange=()=>dirty=true;$('#expense-form').onsubmit=e=>{e.preventDefault();const amount=Number($('#amount').value.replace(',','.'));if(!Number.isFinite(amount)||amount<=0){$('#save-error').hidden=false;$('#save-error').textContent='Inserisci un importo maggiore di zero.';$('#amount').setAttribute('aria-invalid','true');$('#amount').setAttribute('aria-describedby','save-error');$('#amount').focus();return}if(!$('#date').value||!$('#expense-form').reportValidity())return;if(state.scenario==='save-error'){$('#save-error').hidden=false;$('#save-error').textContent='Salvataggio non riuscito. I dati sono qui: puoi riprovare.';return}const row={id:existing?.id||'demo-'+Date.now(),name:$('#description').value.trim()||cats[$('#category').value].name,amount,cat:$('#category').value,date:$('#date').value};state.rows=[...state.rows.filter(r=>r.id!==row.id),row].sort((a,b)=>b.date.localeCompare(a.date));if(paymentMode)state.pending=false;dirty=false;finishClose();render();if(existing){const target=document.querySelector('[data-row="'+row.id+'"]')||$('#main');target.focus({preventScroll:true})}notify(existing?'Modifica salvata':'Uscita registrata',row.id)};$('#amount').focus()}
function payment(){expense(true)}
function rowDetail(id){const r=state.rows.find(x=>x.id===id);if(!r)return;show(r.name,`<div class="net-number money">−${money(r.amount)}</div><div class="data-row"><span>Categoria</span><strong>${cats[r.cat].name}</strong></div><div class="data-row"><span>Conto</span><strong>Conto Corrente</strong></div><div class="data-row"><span>Data</span><strong>${r.date.split('-').reverse().join('/')}</strong></div>`,`<button class="button primary" id="edit-row">Modifica uscita</button>`);$('#edit-row').onclick=()=>{finishClose();expense(false,id)}}
function filters(){show('Filtri',`<div class="form-field"><label for="filter-category">Categoria</label><select id="filter-category"><option value="">Tutte le categorie</option>${Object.keys(cats).map(c=>`<option value="${c}" ${state.filter===c?'selected':''}>${cats[c].name}</option>`).join('')}</select></div><p class="small muted" style="margin-top:18px">Il testo di ricerca rimane attivo.</p>`,`<button class="button secondary" id="clear-filters">Azzera filtri</button><button class="button primary" id="apply-filters">Applica filtri</button>`);$('#apply-filters').onclick=()=>{state.filter=$('#filter-category').value;finishClose();updateLedger()};$('#clear-filters').onclick=()=>{state.filter='';state.hasPeriod=false;finishClose();updateLedger()}}
function calculation(){const t=totals();show('Come è calcolato',`<p class="small muted">Piano di ottobre</p>${[['Entrate attese',state.income],['Risparmio da mantenere',-state.savings],['Investimenti dai conti',-state.invest],['Spese registrate',-t.spent],['Spese programmate',-t.scheduled]].map(([n,v])=>`<div class="data-row"><span>${n}</span><strong class="money">${money(v)}</strong></div>`).join('')}<div class="data-row"><span>Margine</span><strong class="money">${money(t.margin)}</strong></div><p class="note">Non è il saldo dei conti. Le entrate attese devono ancora arrivare se segnalate nel piano.</p>`)}
function cashCalculation(){const t=totals();show('Liquidità libera stimata',`<p class="small muted">Fino al 31 ottobre</p>${[['Saldo dei conti',t.cash],['Impegni entro fine mese',-t.scheduled],['Riserva',-(state.scenario==='empty'?0:500)],['Liquidità libera stimata',t.free]].map(([n,v])=>`<div class="data-row"><span>${n}</span><strong class="money">${money(v)}</strong></div>`).join('')}<p class="note">È una stima basata sui dati registrati, distinta dal margine del piano.</p>`)}
function editPlan(){show('Le tue scelte per ottobre',`<form id="plan-form"><label class="form-field">Entrate attese<input id="plan-income" inputmode="decimal" required value="${state.plan?state.income:''}"></label><label class="form-field">Risparmio da mantenere<input id="plan-savings" inputmode="decimal" required value="${state.plan?state.savings:''}"></label><label class="form-field">Investimenti dai conti<input id="plan-invest" inputmode="decimal" required value="${state.plan?state.invest:''}"></label><p class="note">Queste sono intenzioni del mese, non saldi bancari.</p><p id="plan-error" role="alert" class="form-error" hidden></p></form>`,`<button class="button primary" type="submit" form="plan-form">Conferma piano</button>`);$('#plan-form').onsubmit=e=>{e.preventDefault();const values=['#plan-income','#plan-savings','#plan-invest'].map(s=>Number($(s).value.replace(',','.')));if(values.some(v=>!Number.isFinite(v)||v<0)){$('#plan-error').hidden=false;$('#plan-error').textContent='Inserisci valori validi, anche zero.';return}[state.income,state.savings,state.invest]=values;state.plan=true;finishClose();render()}}
function categoryDetail(c){const spent=state.rows.filter(r=>r.cat===c).reduce((s,r)=>s+r.amount,0),scheduled=dueItems().filter(d=>d.cat===c).reduce((s,d)=>s+d.amount,0);show(cats[c].name,`${[['Limite',cats[c].limit],['Speso',spent],['Programmato',scheduled],['Residuo',cats[c].limit-spent-scheduled]].map(([n,v])=>`<div class="data-row"><span>${n}</span><strong class="money">${money(v)}</strong></div>`).join('')}<p class="note">Il residuo include già le spese programmate.</p>`,`<button class="button primary" id="category-movements">Vedi movimenti</button>`);$('#category-movements').onclick=()=>{state.filter=c;finishClose();go('movimenti')}}
function investments(){if(state.scenario==='empty'){show('Investimenti','<p>Non ci sono investimenti registrati.</p>');return}show('Investimenti',`<div class="data-row"><span>Capitale investito</span><strong class="money">${money(4200)}</strong></div><div class="data-row"><span>Ultimo controvalore noto<small>Data di aggiornamento da verificare</small></span><strong class="money">${money(4380)}</strong></div><p class="note">Il patrimonio mostrato usa il capitale investito. Il controvalore resta un dato separato.</p>`)}
function notify(message,id){clearTimeout(toastTimer);$('#toast').innerHTML=`<div class="toast-content"><span>${message}</span><button id="see-saved">Vedi movimento</button><button id="dismiss-feedback" aria-label="Chiudi conferma">${icon('close',14)}</button></div>`;$('#toast').hidden=false;$('#see-saved').onclick=()=>rowDetail(id);$('#dismiss-feedback').onclick=()=>$('#toast').hidden=true}
function firstAccount(){show('Il primo conto','<form id="account-form"><label class="form-field">Nome del conto<input value="Conto Corrente" readonly></label><label class="form-field">Saldo iniziale<input id="opening-balance" inputmode="decimal" value="0"></label><p class="note">Puoi iniziare anche da zero. Nessun collegamento alla banca.</p></form>','<button class="button primary" type="submit" form="account-form">Crea conto</button>');$('#account-form').onsubmit=e=>{e.preventDefault();const balance=Number($('#opening-balance').value.replace(',','.'));if(!Number.isFinite(balance))return;state.newAccountBalance=balance;finishClose();render()}}
function profile(){show('Profilo e impostazioni','<button class="data-row" style="width:100%" id="profile-theme"><span>Tema chiaro / scuro</span>'+icon('arrow',16)+'</button><h3 class="section">Dati e preferenze</h3><p class="small muted" style="margin-top:12px">Conti e categorie · Importazione · Notifiche</p><h3 class="section">Account</h3><p class="small muted" style="margin-top:12px">Accesso Google · Gestione dei dati</p>');$('#profile-theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'}
$('#mobile-brand').innerHTML=logo;$('#desktop-brand').innerHTML=logo;document.querySelectorAll('[data-add]').forEach(b=>{b.innerHTML=icon('plus',18)+'<span>Aggiungi</span>';b.onclick=()=>expense()});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=profile);document.documentElement.dataset.theme=q.get('theme')==='dark'?'dark':'light';if(q.has('capture'))document.documentElement.classList.add('capture');$('#scenario').value=q.get('case')||'standard';$('#scenario').onchange=reset;$('#reset').onclick=()=>{reset();$('#toast').hidden=true};$('#theme-toggle').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';reset();if(q.has('editor'))expense();history.replaceState({page:state.page},'');window.addEventListener('popstate',e=>{if(modal.open){requestClose();return}go(e.state?.page||'oggi',true)});window.sunnyStudy={state:()=>structuredClone(state),totals,go,expense};
</script>
